name: Patchquill daily scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan for every tracked business
        run: python main.py scan-all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Print open issues (shows up in the run log)
        run: python main.py issues --status open
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
